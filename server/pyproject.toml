[project]
name = "llm-rag-server"
version = "0.1.0"
description = "FastAPI proxy between the web app, llama-server and the database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
